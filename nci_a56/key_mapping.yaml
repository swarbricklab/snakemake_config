# Map betwen PBS Pro resource specifications and human-readable keys
# Note: Snakemake automatically converts mem and disk to mem_mb and disk_mb
system: "pbspro"

pbspro:
  command: "qsub -S /bin/bash -V -l wd -j oe "
  key_mapping:
    project: "-P {}"
    name: "-N {}"
    account: "-A {}"
    storage: "-l storage={}"
    threads: "-l ncpus={}"
    mem_mb: "-l mem={}mb"
    disk_mb: "-l jobfs={}mb"
    jobid: "{}"
    runtime: null