__use_yte__: true

__definitions__:
  - import os

__variables__:
  PROJECT: ?os.getenv("PROJECT")
  STORAGE: ?"gdata/"+os.getenv("PROJECT")

# Global Snakemake config for snakemake workflows
# Config specified here is merged with workflow-specific config

jobname: "{name}.{jobid}"

# Executor plugin configuration (Snakemake 8+ replaces cluster: directive)
executor: cluster-generic
cluster-generic-submit-cmd: "pbs_submit.py"
cluster-generic-status-cmd: "pbs_status.sh"
cluster-generic-cancel-cmd: "qdel"

# Conda settings
conda-prefix: /g/data/a56/conda/snakecache/

# Software deployment (Snakemake 8+ replaces use-singularity: true)
software-deployment-method:
  - conda
  - apptainer
singularity-prefix: "/g/data/a56/software/singularity/images"
singularity-args: "--bind /g/data/a56,/scratch/a56"

# Snakemake settings
jobs: 1000
max-jobs-per-second: 1
max-status-checks-per-second: 10
latency-wait: 60
cores: 99
local-cores: 1 

# Default resources
default-resources:
  # Team settings
  project: ?PROJECT
  storage: ?STORAGE
  # NCI defaults
  runtime: "600" # minutes
  mem_mb: "4000"
  threads: "1"
  disk_mb: "100"
  jobmode: "pbspro" # used by Martian Runtime in 10X tools

